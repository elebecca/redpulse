services:
  backend:
    container_name: redpulse-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.docker
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    container_name: redpulse-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      - backend

    ports:
      - "3000:3000"

    volumes:
      # Source stays on the host so edits are visible without rebuilding.
      - type: bind
        source: ./frontend
        target: /app
      # Keep Linux dependencies and the Next.js cache out of the Windows bind.
      - type: volume
        target: /app/node_modules
      - type: volume
        target: /app/.next

    # Webpack honors WATCHPACK_POLLING reliably for Windows bind mounts.
    command: npm run dev -- --hostname 0.0.0.0 --webpack
